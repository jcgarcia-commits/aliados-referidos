<form id="empresaForm" class="max-w-xl mx-auto p-4 bg-white rounded-md shadow-md space-y-4">
  <!-- Nombre -->
  <div>
    <label class="block text-sm font-medium text-gray-700 mb-1" for="nombre">Nombre</label>
    <input
      id="nombre"
      name="nombre"
      type="text"
      class="w-full px-3 py-2 text-sm border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
      placeholder="Nombre"
      required
      minlength="3"
    />
    <p class="text-red-600 text-xs mt-1 hidden" id="errorNombre">
      Es requerido y mínimo 3 caracteres
    </p>
  </div>

  <!-- Descripción -->
  <div>
    <label class="block text-sm font-medium text-gray-700 mb-1" for="descripcion"
      >Descripción</label
    >
    <input
      id="descripcion"
      name="descripcion"
      type="text"
      class="w-full px-3 py-2 text-sm border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
      placeholder="Descripción"
      required
      minlength="3"
    />
    <p class="text-red-600 text-xs mt-1 hidden" id="errorDescripcion">
      Es requerido y mínimo 3 caracteres
    </p>
  </div>

  <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-4">
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1" for="nombre">Mínimo</label>
      <input
        id="nombre"
        name="nombre"
        type="number"
        class="w-full px-3 py-2 text-sm border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
        required
        value="0"
      />
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Obligatorio</label>
      <label class="relative inline-block w-11 h-6 cursor-pointer">
        <input type="checkbox" class="peer sr-only" checked />
        <span
          class="absolute inset-0 bg-gray-300 rounded-full transition-colors duration-200 ease-in-out peer-checked:bg-blue-600"
        ></span>
        <span
          class="absolute top-1/2 start-0.5 -translate-y-1/2 size-5 bg-white rounded-full shadow-xs transition-transform duration-200 ease-in-out peer-checked:translate-x-full"
        ></span>
      </label>
    </div>
    <div></div>
  </div>

  <!-- Fila 3: Orden / Estado -->
  <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-4">
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Estado</label>
      <label class="relative inline-block w-11 h-6 cursor-pointer">
        <input type="checkbox" class="peer sr-only" checked />
        <span
          class="absolute inset-0 bg-gray-300 rounded-full transition-colors duration-200 ease-in-out peer-checked:bg-blue-600"
        ></span>
        <span
          class="absolute top-1/2 start-0.5 -translate-y-1/2 size-5 bg-white rounded-full shadow-xs transition-transform duration-200 ease-in-out peer-checked:translate-x-full"
        ></span>
      </label>
    </div>
    <div></div>
  </div>

  <!-- Botones -->
  <div class="flex justify-end gap-2">
    <button
      type="button"
      class="bg-gray-600 hover:bg-gray-700 text-white px-4 py-2 rounded transition-colors"
      onclick="document.getElementById('empresaForm').reset();"
    >
      Cancelar
    </button>
    <button
      type="submit"
      class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded transition-colors"
    >
      Guardar
    </button>
  </div>
</form>
