<form id="empresaForm" class="max-w-xl mx-auto p-4 bg-white rounded-md shadow-md space-y-4">
  <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-4">
    <h2 class="text-2xl font-semibold text-gray-800 text-center sm:text-left">Red de referidos</h2>
    <h2 class="text-2xl font-semibold text-gray-800 text-center sm:text-left">Afiliación</h2>
  </div>

  <!-- Nombre -->
  <div>
    <label class="block text-sm font-medium text-gray-700 mb-1" for="nombre">Pregunta</label>
    <input
      id="nombre"
      name="nombre"
      type="text"
      class="w-full px-3 py-2 text-sm border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
      placeholder="Descripción de la pregunta"
      required
      minlength="3"
    />
    <p class="text-red-600 text-xs mt-1 hidden" id="errorNombre">
      Es requerido y mínimo 3 caracteres
    </p>
  </div>

  <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-4">
    <!-- Columna 1 -->
    <div>
      <label class="block text-sm font-medium text-gray-900 mb-1">Tipo</label>
      <select
        class="w-full bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-md px-3 py-2 focus:ring-blue-600 focus:border-blue-600"
      >
        <option value="">Seleccione tipo</option>
        <option value="publica">Text</option>
        <option value="privada">Boolean</option>
      </select>
    </div>

    <!-- Columna 2 -->
    <div>
      <label class="block text-sm font-medium text-gray-900 mb-1">Objeto</label>
      <select
        class="w-full bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-md px-3 py-2 focus:ring-blue-600 focus:border-blue-600"
      >
        <option value="">Seleccione Objeto</option>
        <option value="publica">Input</option>
        <option value="privada">Select</option>
      </select>
    </div>
  </div>

  <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-4">
    <!-- Columna 1 -->
    <div>
      <label class="block text-sm font-medium text-gray-900 mb-1">Grupo</label>
      <select
        class="w-full bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-md px-3 py-2 focus:ring-blue-600 focus:border-blue-600"
      >
        <option value="">Seleccione Grupo</option>
        <option>1</option>
        <option>2</option>
        <option>3</option>
        <option>4</option>
        <option>5</option>
        <option>6</option>
      </select>
    </div>

    <!-- Columna 2 -->
    <div>
      <label class="block text-sm font-medium text-gray-900 mb-1">Orden</label>
      <input
        type="number"
        value="0"
        class="w-full bg-white border border-gray-300 text-gray-900 text-sm rounded-md px-3 py-2 focus:ring-blue-600 focus:border-blue-600"
        placeholder="Orden"
      />
    </div>
  </div>

  <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-4">
    <!-- Columna izquierda: Toggle Estado -->
    <div>
      <label class="block text-sm font-medium text-gray-900 mb-1">Estado</label>

      <label class="relative inline-block w-11 h-6 cursor-pointer">
        <input type="checkbox" class="peer sr-only" checked />
        <span
          class="absolute inset-0 bg-gray-300 rounded-full transition-colors duration-200 ease-in-out peer-checked:bg-blue-600"
        ></span>
        <span
          class="absolute top-1/2 start-0.5 -translate-y-1/2 size-5 bg-white rounded-full shadow-xs transition-transform duration-200 ease-in-out peer-checked:translate-x-full"
        ></span>
      </label>
    </div>

    <!-- Columna derecha (vacía o puedes agregar algo luego) -->
    <div></div>
  </div>

  <!-- Botones -->
  <div class="flex justify-end gap-2">
    <button
      type="button"
      class="bg-gray-600 hover:bg-gray-700 text-white px-4 py-2 rounded transition-colors"
      onclick="document.getElementById('empresaForm').reset();"
    >
      Cancelar
    </button>
    <button
      type="submit"
      class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded transition-colors"
    >
      Guardar
    </button>
  </div>
</form>
