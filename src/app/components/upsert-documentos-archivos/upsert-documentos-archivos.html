<div class="mt-2 grid gap-4 mb-4 sm:grid-cols-4">
  <div>
    <label class="block mb-2 text-sm font-medium text-gray-900 h-10 flex items-end">
      País Documento<span class="text-red-600">*</span>
    </label>
    <select
      class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-600 focus:border-blue-600 w-full p-2.5"
    >
      <option value="">Seleccione país</option>
      <option value="publica">Guatemala</option>
    </select>
  </div>

  <div>
    <label class="block mb-2 text-sm font-medium text-gray-900 h-10 flex items-end">
      Tipo Documento<span class="text-red-600">*</span>
    </label>
    <select
      class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-600 focus:border-blue-600 w-full p-2.5"
    >
      <option value="">Seleccione un tipo</option>
      <option value="dpi">DPI</option>
      <option value="nit">NIT</option>
    </select>
  </div>

  <div>
    <label class="block mb-2 text-sm font-medium text-gray-900 h-10 flex items-end">
      Número Doc.<span class="text-red-600">*</span>
    </label>
    <input
      type="number"
      class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-600 focus:border-blue-600 w-full p-2.5"
      placeholder="Número Documento"
    />
  </div>

  <div>
    <label class="block mb-2 text-sm font-medium text-gray-900 h-10 flex items-end">
      Vence Doc.<span class="text-red-600">*</span>
    </label>

    <div class="relative max-w-sm">
      <div class="absolute inset-y-0 start-0 flex items-center ps-3 pointer-events-none">
        <svg class="w-4 h-4 text-body" viewBox="0 0 24 24">
          <path
            stroke="currentColor"
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M4 10h16m-8-3V4M7 7V4m10 3V4M5 20h14a1 1 0 0 0 1-1V7a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1Z"
          />
        </svg>
      </div>

      <input
        id="datepicker-autohide-69"
        datepicker
        datepicker-autohide
        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full ps-10 p-2.5"
        placeholder="Select date"
      />
    </div>
  </div>
</div>

<div class="grid gap-6 mt-4 mb-4 sm:grid-cols-2">
  <!-- FOTO FRONTAL -->
  <div>
    <label class="block text-sm font-medium text-gray-700 mb-2">
      Foto frontal DPI<span class="text-red-600">*</span>
    </label>

    <input
      type="file"
      id="frontDpiInput"
      accept="image/*"
      (change)="onFrontImageSelected($event)"
      class="hidden"
    />

    <div
      onclick="document.getElementById('frontDpiInput').click()"
      class="w-full h-48 border-2 border-dashed border-gray-300 rounded-xl flex flex-col items-center justify-center cursor-pointer bg-gray-50 hover:bg-gray-100 transition shadow-sm hover:shadow-md p-4 overflow-hidden"
    >
      <!-- Mostrar imagen cuando ya se seleccionó -->
      <img
        *ngIf="frontPreview"
        [src]="frontPreview"
        class="w-full h-full object-cover rounded-xl"
      />

      <!-- Mostrar placeholder si NO hay imagen -->
      <div *ngIf="!frontPreview" class="flex flex-col items-center text-center text-gray-500">
        <svg
          class="w-10 h-10 mb-2"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          viewBox="0 0 24 24"
        >
          <path d="M4 16v1a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
        </svg>
        <span>Clic para subir Foto Frontal</span>
      </div>
    </div>
  </div>

  <!-- FOTO REVERSO -->
  <div>
    <label class="block text-sm font-medium text-gray-700 mb-2">
      Foto reverso DPI<span class="text-red-600">*</span>
    </label>

    <input
      type="file"
      id="backDpiInput"
      accept="image/*"
      (change)="onBackImageSelected($event)"
      class="hidden"
    />

    <div
      onclick="document.getElementById('backDpiInput').click()"
      class="w-full h-48 border-2 border-dashed border-gray-300 rounded-xl flex flex-col items-center justify-center cursor-pointer bg-gray-50 hover:bg-gray-100 transition shadow-sm hover:shadow-md p-4 overflow-hidden"
    >
      <!-- Imagen si existe -->
      <img *ngIf="backPreview" [src]="backPreview" class="w-full h-full object-cover rounded-xl" />

      <!-- Placeholder -->
      <div *ngIf="!backPreview" class="flex flex-col items-center text-center text-gray-500">
        <svg
          class="w-10 h-10 mb-2"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          viewBox="0 0 24 24"
        >
          <path d="M4 16v1a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
        </svg>
        <span>Clic para subir Foto Reverso</span>
      </div>
    </div>
  </div>
</div>
<div class="items-start mt-2 grid gap-4 mb-4 sm:grid-cols-3">
  <div class="flex flex-col">
    <label class="block text-sm font-medium text-gray-700 mb-1">Cuenta BANTOTAL</label>
    <input
      type="number"
      class="w-full px-3 py-2 text-sm border border-gray-300 rounded-md"
      placeholder="Número de cuenta"
    />
  </div>
</div>
