  <div

    (mouseleave)="onMouseLeave()"
  >
    <div
      class="px-6 py-4 cursor-pointer flex items-center justify-between transition-colors duration-200"
      [class.bg-blue-50]="activeSection() === 'documentos'"
      [class.bg-white]="activeSection() !== 'documentos'"
    >
      <div class="flex items-center gap-3">
        <svg
          class="w-6 h-6"
          [class.text-blue-600]="activeSection() === 'documentos'"
          [class.text-gray-500]="activeSection() !== 'documentos'"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"

        </svg>
        <h3

          [class.text-blue-700]="activeSection() === 'documentos'"
          [class.text-gray-800]="activeSection() !== 'documentos'"
        >
          Documento de Identificación
        </h3>

        class="w-5 h-5 transition-transform duration-300 ease-in-out"

        [class.text-gray-400]="activeSection() !== 'documentos'"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24"

        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M19 9l-7 7-7-7"
        ></path>
      </svg>
    </div>

    <div
      class="overflow-hidden transition-all duration-500 ease-in-out"
      [style.max-height]="activeSection() === 'documentos' ? '1000px' : '0px'"
      [style.opacity]="activeSection() === 'documentos' ? '1' : '0'"
    >

        <app-upsert-documentos-archivos></app-upsert-documentos-archivos>
