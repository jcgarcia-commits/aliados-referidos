<div class="w-full max-w-6xl mx-auto space-y-2">
  <!-- Documentos de Identificación y Archivos -->

  <h4 class="text-lg font-bold text-gray-800 text-center mb-4 leading-snug">
    Paola Citán (Solicitante)<br />Librería Milenium (Entidad)
  </h4>

  <div
    class="border border-gray-300 rounded-lg overflow-hidden bg-white shadow-sm hover:shadow-md transition-all duration-300"
    (mouseenter)="onMouseEnter('documentos')"
    (mouseleave)="onMouseLeave()"
  >
    <div
      class="px-6 py-4 cursor-pointer flex items-center justify-between transition-colors duration-200"
      [class.bg-blue-50]="activeSection() === 'documentos'"
      [class.bg-white]="activeSection() !== 'documentos'"
    >
      <div class="flex items-center gap-3">
        <svg
          class="w-6 h-6"
          [class.text-blue-600]="activeSection() === 'documentos'"
          [class.text-gray-500]="activeSection() !== 'documentos'"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"
          ></path>
        </svg>
        <h3
          class="text-lg font-semibold transition-colors duration-200"
          [class.text-blue-700]="activeSection() === 'documentos'"
          [class.text-gray-800]="activeSection() !== 'documentos'"
        >
          Datos de la solicitud
        </h3>
      </div>

      <svg
        class="w-5 h-5 transition-transform duration-300 ease-in-out"
        [class.rotate-180]="activeSection() === 'documentos'"
        [class.text-blue-600]="activeSection() === 'documentos'"
        [class.text-gray-400]="activeSection() !== 'documentos'"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M19 9l-7 7-7-7"
        ></path>
      </svg>
    </div>

    <div
      class="overflow-hidden transition-all duration-500 ease-in-out"
      [style.max-height]="activeSection() === 'documentos' ? '1000px' : '0px'"
      [style.opacity]="activeSection() === 'documentos' ? '1' : '0'"
    >
      <div class="px-6 py-4 bg-gray-50 border-t border-gray-200">
        <!-- Acá el componente -->
        <app-upsert-datos-solicitud></app-upsert-datos-solicitud>
      </div>
    </div>
  </div>

  <!-- Datos Personales y Demográficos -->
  <div
    class="border border-gray-300 rounded-lg overflow-hidden bg-white shadow-sm hover:shadow-md transition-all duration-300"
    (mouseenter)="onMouseEnter('datos')"
    (mouseleave)="onMouseLeave()"
  >
    <div
      class="px-6 py-4 cursor-pointer flex items-center justify-between transition-colors duration-200"
      [class.bg-blue-50]="activeSection() === 'datos'"
      [class.bg-white]="activeSection() !== 'datos'"
    >
      <div class="flex items-center gap-3">
        <svg
          class="w-6 h-6"
          [class.text-blue-600]="activeSection() === 'datos'"
          [class.text-gray-500]="activeSection() !== 'datos'"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"
          ></path>
        </svg>
        <h3
          class="text-lg font-semibold transition-colors duration-200"
          [class.text-blue-700]="activeSection() === 'datos'"
          [class.text-gray-800]="activeSection() !== 'datos'"
        >
          Expediente
        </h3>
      </div>

      <svg
        class="w-5 h-5 transition-transform duration-300 ease-in-out"
        [class.rotate-180]="activeSection() === 'datos'"
        [class.text-blue-600]="activeSection() === 'datos'"
        [class.text-gray-400]="activeSection() !== 'datos'"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M19 9l-7 7-7-7"
        ></path>
      </svg>
    </div>

    <div
      class="overflow-hidden transition-all duration-500 ease-in-out"
      [style.max-height]="activeSection() === 'datos' ? '1000px' : '0px'"
      [style.opacity]="activeSection() === 'datos' ? '1' : '0'"
    >
      <div class="px-6 py-4 bg-gray-50 border-t border-gray-200">
        <app-upsert-expediente></app-upsert-expediente>
      </div>
    </div>
  </div>
</div>
