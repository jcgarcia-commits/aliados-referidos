<form id="empresaForm" class="max-w-xl mx-auto p-4 bg-white rounded-md shadow-md space-y-4">
  <div class="mt-2 grid gap-4 mb-4 sm:grid-cols-2">
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1" for="nombre">Empresa</label>
      <label class="block text-sm font-medium text-gray-700 mb-1" for="nombre"
        >LIBRERIA EL PORVENIR</label
      >
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1" for="nombre">Representante</label>
      <label class="block text-sm font-medium text-gray-700 mb-1" for="nombre">Paola Citán</label>
    </div>
  </div>
  <!-- Select Banco -->
  <div>
    <label class="block text-sm font-medium text-gray-700 mb-1" for="tipo">Banco</label>
    <select
      id="tipo"
      name="tipo"
      class="w-full px-3 py-2 text-sm border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
    >
      <option value="">Seleccione un banco (*)</option>
      <option value="publica">BANRURAL</option>
      <option value="privada">BAM</option>
      <option value="publica">GyT</option>
      <option value="privada">INDUSTRIAL</option>
    </select>
  </div>

  <!-- Número de cuenta -->
  <div>
    <label class="block text-sm font-medium text-gray-700 mb-1" for="nombre"
      >Número de Cuenta (*)</label
    >
    <input
      id="nombre"
      name="nombre"
      type="number"
      class="w-full px-3 py-2 text-sm border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
      placeholder="Número de cuenta"
      required
      minlength="3"
    />
  </div>

  <!-- Nombre de la cuentq -->
  <div>
    <label class="block text-sm font-medium text-gray-700 mb-1" for="nombre"
      >Nombre de la cuenta (*)</label
    >
    <input
      id="nombre"
      name="nombre"
      type="text"
      class="w-full px-3 py-2 text-sm border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
      placeholder="Nombre Cuenta"
      required
      minlength="3"
    />
    <p class="text-red-600 text-xs mt-1 hidden" id="errorNombre">
      Nombre es requerido y mínimo 3 caracteres
    </p>
  </div>

  <!-- Select Tipo Cuenta -->
  <div>
    <label class="block text-sm font-medium text-gray-700 mb-1" for="tipo">Tipo Cuenta (*)</label>
    <select
      id="tipo"
      name="tipo"
      class="w-full px-3 py-2 text-sm border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
    >
      <option value="">Seleccione Tipo de Cuenta</option>
      <option value="publica">Ahorro</option>
      <option value="privada">Monetaria</option>
    </select>
  </div>

  <!-- Select Tipo Moneda -->
  <div>
    <label class="block text-sm font-medium text-gray-700 mb-1" for="tipo">Tipo Moneda (*)</label>
    <select
      id="tipo"
      name="tipo"
      class="w-full px-3 py-2 text-sm border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
    >
      <option value="">Seleccione Tipo de Moneda</option>
      <option value="publica">Q</option>
      <option value="privada">$</option>
    </select>
  </div>

  <!-- Nombre -->
  <div>
    <label class="block text-sm font-medium text-gray-700 mb-1" for="nombre">Activo (*)</label>

    <label for="hs-basic-usage" class="relative inline-block w-11 h-6 cursor-pointer">
      <input type="checkbox" id="hs-basic-usage" class="peer sr-only" />
      <span
        class="absolute inset-0 bg-gray-200 rounded-full transition-colors duration-200 ease-in-out peer-checked:bg-blue-600 dark:bg-neutral-700 dark:peer-checked:bg-blue-500 peer-disabled:opacity-50 peer-disabled:pointer-events-none"
      ></span>
      <span
        class="absolute top-1/2 start-0.5 -translate-y-1/2 size-5 bg-white rounded-full shadow-xs transition-transform duration-200 ease-in-out peer-checked:translate-x-full dark:bg-neutral-400 dark:peer-checked:bg-white"
      ></span>
    </label>
  </div>

  <!-- Botones -->
  <div class="flex justify-end gap-2">
    <button
      type="button"
      class="bg-gray-600 hover:bg-gray-700 text-white px-4 py-2 rounded transition-colors"
      onclick="document.getElementById('empresaForm').reset();"
    >
      Cancelar
    </button>
    <button
      type="submit"
      class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded transition-colors"
    >
      Guardar
    </button>
  </div>
</form>
