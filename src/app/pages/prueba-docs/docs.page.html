<div class="min-h-screen bg-slate-200 p-10 no-print">
  <div class="max-w-4xl mx-auto bg-white p-6 rounded-xl shadow-lg border border-slate-300">
    <h2 class="text-xl font-bold mb-4 text-slate-700">Generar Documentos</h2>

    <div class="flex gap-4">
      <button
        (click)="generarDocumento()"
        class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-6 rounded transition shadow-md"
      >
        Generar Documento
      </button>

      <button
        *ngIf="htmlGenerado"
        (click)="imprimir()"
        class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded transition shadow-md"
      >
        Imprimir PDF
      </button>
    </div>
  </div>

  <div *ngIf="htmlGenerado" class="mt-10 animate-fade-in">
    <div
      class="max-w-[21cm] mx-auto bg-white shadow-2xl p-[2cm] border border-gray-200"
      [innerHTML]="htmlGenerado"
    ></div>
  </div>
</div>

<style>
  @media print {
    .no-print {
      display: none !important;
    }
    body {
      background: white;
    }
    .max-w-\[21cm\] {
      box-shadow: none !important;
      border: none !important;
      margin: 0 !important;
      width: 100% !important;
    }
  }
  .animate-fade-in {
    animation: fadeIn 0.5s ease-in;
  }
  @keyframes fadeIn {
    from {
      opacity: 0;
      transform: translateY(10px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }
</style>
