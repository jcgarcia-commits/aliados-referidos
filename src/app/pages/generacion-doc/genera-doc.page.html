<div class="min-h-screen bg-slate-100 p-4 md:p-8 font-sans relative overflow-hidden">
  <div
    *ngIf="showToast"
    class="fixed top-5 right-5 z-[100] flex items-center gap-3 px-4 py-3 rounded shadow-lg text-white animate-bounce bg-green-600 transition-all duration-500"
  >
    <svg
      xmlns="http://www.w3.org/2000/svg"
      class="h-6 w-6"
      fill="none"
      viewBox="0 0 24 24"
      stroke="currentColor"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="2"
        d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"
      />
    </svg>
    <span class="font-medium">Plantilla guardada con éxito</span>
  </div>

  <div class="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-8">
    <div class="lg:col-span-4 space-y-6">
      <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
        <h2 class="text-xl font-bold text-slate-800 mb-4 flex items-center">
          <span class="bg-blue-600 text-white p-1.5 rounded-lg mr-2">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="h-5 w-5"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"
              />
            </svg>
          </span>
          Cargar Plantilla
        </h2>

        <input
          #fileInput
          type="file"
          (change)="onFileSelected($event)"
          accept=".docx"
          class="block w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 transition-all cursor-pointer"
        />
      </div>

      <div
        *ngIf="variables.length > 0"
        class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200"
      >
        <h3 class="text-sm font-bold text-slate-500 uppercase tracking-wider mb-4">
          Campos Detectados
        </h3>

        <div class="space-y-4">
          <div *ngFor="let varName of variables">
            <label class="block text-sm font-semibold text-slate-700 mb-1 capitalize">
              {{ formatLabel(varName) }}
            </label>
            <input
              [(ngModel)]="formValues[varName]"
              type="text"
              class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition-all"
              placeholder="Ingrese descripción del parámetro"
            />
          </div>
        </div>

        <button
          (click)="guardarPlantilla()"
          [disabled]="isLoading"
          class="w-full mt-8 bg-slate-900 text-white font-bold py-3 rounded-xl hover:bg-slate-800 transition-all active:scale-[0.98] flex justify-center items-center disabled:opacity-70"
        >
          <ng-container *ngIf="!isLoading"> Guardar Plantilla </ng-container>

          <ng-container *ngIf="isLoading">
            <svg
              class="animate-spin h-5 w-5 text-white"
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
            >
              <circle
                class="opacity-25"
                cx="12"
                cy="12"
                r="10"
                stroke="currentColor"
                stroke-width="4"
              ></circle>
              <path
                class="opacity-75"
                fill="currentColor"
                d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
              ></path>
            </svg>
            <span class="ml-2">Guardando...</span>
          </ng-container>
        </button>
      </div>
    </div>

    <div class="lg:col-span-8 flex justify-center">
      <div
        *ngIf="htmlRaw; else emptyState"
        class="bg-gray-300 p-6 rounded-xl w-full flex justify-center overflow-auto"
      >
        <div
          id="preview-doc"
          class="bg-white shadow-2xl border border-slate-300 w-full max-w-[210mm] min-h-[297mm] p-[20mm] origin-top"
        >
          <div class="prose prose-slate max-w-none prose-p:my-2" [innerHTML]="sanitizedHtml"></div>
        </div>
      </div>

      <ng-template #emptyState>
        <div
          class="flex flex-col items-center justify-center w-full h-[600px] border-4 border-dashed border-slate-200 rounded-3xl text-slate-400"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-16 w-16 mb-4 opacity-20"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z"
            />
          </svg>
          <p class="text-lg font-medium">Sube un archivo para previsualizar</p>
        </div>
      </ng-template>
    </div>
  </div>
</div>
