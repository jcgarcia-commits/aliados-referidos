<div class="min-h-screen bg-slate-100 p-4 md:p-8 font-sans">
  <div class="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-8">
    <div class="lg:col-span-4 space-y-6">
      <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
        <h2 class="text-xl font-bold text-slate-800 mb-4 flex items-center">
          <span class="bg-blue-600 text-white p-1.5 rounded-lg mr-2">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="h-5 w-5"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"
              />
            </svg>
          </span>
          Cargar Plantilla
        </h2>

        <input
          type="file"
          (change)="onFileSelected($event)"
          accept=".docx"
          class="block w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 transition-all cursor-pointer"
        />
      </div>

      <div
        *ngIf="variables.length > 0"
        class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 animate-in fade-in slide-in-from-left-4 duration-500"
      >
        <h3 class="text-sm font-bold text-slate-500 uppercase tracking-wider mb-4">
          Campos Detectados
        </h3>

        <div class="space-y-4">
          <div *ngFor="let varName of variables">
            <label class="block text-sm font-semibold text-slate-700 mb-1 capitalize">{{
              varName.replace('_', ' ')
            }}</label>
            <input
              [(ngModel)]="formValues[varName]"
              type="text"
              class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all placeholder:text-slate-400"
              [placeholder]="'Introduce ' + varName"
            />
          </div>
        </div>

        <button
          (click)="downloadPDF()"
          class="w-full mt-8 bg-slate-900 text-white font-bold py-3 rounded-xl hover:bg-slate-800 active:scale-[0.98] transition-all flex items-center justify-center gap-2"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-5 w-5"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M4 16v1a2 2 0 002 2h12a2 2 0 002-2v-1m-4-4l-4 4m0 0l-4-4m4 4V4"
            />
          </svg>
          Exportar a PDF
        </button>
      </div>
    </div>

    <div class="lg:col-span-8 flex justify-center">
      <div
        *ngIf="htmlRaw; else emptyState"
        class="bg-white shadow-2xl border border-slate-300 w-full max-w-[210mm] min-h-[297mm] p-[20mm] origin-top transition-transform overflow-hidden"
        id="preview-doc"
      >
        <div class="prose prose-slate max-w-none prose-p:my-2" [innerHTML]="processedContent"></div>
      </div>

      <ng-template #emptyState>
        <div
          class="flex flex-col items-center justify-center w-full h-[600px] border-4 border-dashed border-slate-200 rounded-3xl text-slate-400"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-16 w-16 mb-4 opacity-20"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z"
            />
          </svg>
          <p class="text-lg font-medium">Sube un archivo para previsualizar</p>
        </div>
      </ng-template>
    </div>
  </div>
</div>
