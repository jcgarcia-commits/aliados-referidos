<div class="h-screen w-screen bg-slate-200 p-4 md:p-8 font-sans flex flex-col overflow-hidden">
  
  <div class="max-w-7xl mx-auto grid grid-cols-1 md:grid-cols-12 gap-8 w-full h-full overflow-hidden">
    
    <div class="md:col-span-4 flex flex-col gap-6 h-full overflow-hidden">
      
      <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200 shrink-0">
        <h2 class="text-2xl font-extrabold text-slate-800 mb-6 flex items-center">
          <span class="bg-blue-600 text-white p-2 rounded-xl mr-3 shadow-lg">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
            </svg>
          </span>
          Documentos
        </h2>

        <div class="space-y-4">
          <div>
            <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1 ml-1">Tipo Afiliación</label>
            <input type="text" [(ngModel)]="tipoAfiliacion" readonly class="w-full px-4 py-2 bg-slate-50 border border-slate-200 rounded-xl text-slate-500 font-medium outline-none" />
          </div>
          <div>
            <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1 ml-1">Tipo Solicitud</label>
            <select [(ngModel)]="tipoSolicitud" (change)="onSolicitudChange()" class="w-full px-4 py-2 bg-white border-2 border-slate-100 rounded-xl text-slate-700 font-bold focus:border-blue-500 outline-none transition-all cursor-pointer shadow-sm">
              <option value="" disabled selected>Seleccione una plantilla...</option>
              <option value="Registro de Afiliación">Registro de Afiliación</option>
              <option value="Actualización cuenta bancaria">Actualización cuenta bancaria</option>
            </select>
          </div>
        </div>
      </div>

      <div *ngIf="camposDetectados.length > 0" class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200 flex flex-col flex-grow overflow-hidden">
        <h3 class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-4 ml-1">Campos Detectados</h3>
        
        <div class="flex-grow overflow-y-auto pr-2 custom-scrollbar">
          <div class="space-y-4 py-2">
            <div *ngFor="let campo of camposDetectados" class="px-1">
              <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1 ml-1">
                {{ formatLabel(campo) }}
              </label>
              <input type="text" 
                     [(ngModel)]="valores[campo]" 
                     class="w-full px-4 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-600 focus:border-blue-600 transition-all" />
            </div>
          </div>
        </div>

        <div class="pt-4 mt-2 border-t border-slate-100 shrink-0">
          <button (click)="procesarYRenderizar()" 
                  class="w-full py-4 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-2xl shadow-lg transition-all transform active:scale-95 flex items-center justify-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
            </svg>
            Actualizar Documento
          </button>
        </div>
      </div>
    </div>

    <div class="md:col-span-8 flex flex-col h-full overflow-hidden">
      <div class="w-full h-full bg-slate-400 rounded-[2.5rem] shadow-inner border border-slate-300 overflow-y-auto custom-scrollbar relative flex flex-col items-center">
        
        <div #renderContainer class="w-full flex flex-col items-center">
        </div>

        <div *ngIf="cargando" class="absolute inset-0 flex flex-col items-center justify-center bg-slate-400/80 backdrop-blur-sm z-50 rounded-[2.5rem]">
          <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-white mb-4"></div>
          <p class="text-white font-bold tracking-widest uppercase">Generando vista...</p>
        </div>

        <div *ngIf="!tipoSolicitud && !cargando" class="absolute inset-0 flex flex-col items-center justify-center text-white/40 italic text-center p-10">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-20 w-20 mb-6 opacity-20" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z" />
          </svg>
          <p class="text-lg font-medium uppercase tracking-widest">Seleccione una plantilla</p>
        </div>
      </div>
    </div>

  </div>
</div>
