<div class="p-6 max-w-[1600px] mx-auto bg-gray-100 min-h-screen">
  <div class="flex flex-col lg:flex-row gap-8">
    <div class="lg:w-1/4 flex flex-col gap-6">
      <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200 sticky top-6">
        <div class="flex flex-col gap-1.5 mb-4">
          <label class="text-sm font-medium text-gray-700">Tipo de Afiliación *</label>
          <select
            [(ngModel)]="tipoAfiliacion"
            class="w-full p-2.5 bg-white border border-gray-300 rounded-md outline-none focus:ring-2 focus:ring-blue-500"
          >
            <option value="red_referidos">Red de referidos</option>
          </select>
        </div>

        <div class="flex flex-col gap-1.5 mb-8">
          <label class="text-sm font-medium text-gray-700">Tipo de Solicitud *</label>
          <select
            [(ngModel)]="tipoSolicitud"
            class="w-full p-2.5 bg-white border border-gray-300 rounded-md outline-none focus:ring-2 focus:ring-blue-500"
          >
            <option value="" disabled selected>-- Seleccione una opción --</option>
            <option value="registro">Registro de Afiliación</option>
            <option value="actualizacion">Actualización cuenta bancaria</option>
          </select>
        </div>

        <button
          (click)="activarPrevisualizacion()"
          [disabled]="!tipoSolicitud"
          class="w-full mb-6 px-4 py-3 bg-[#009661] hover:bg-[#007d51] disabled:bg-gray-300 text-white font-bold rounded-lg transition shadow-md"
        >
          Generar Documento
        </button>

        <div class="border-t border-gray-100 pt-6" *ngIf="mostrarDocumento">
          <p class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-3">Exportar</p>

          <button
            (click)="descargarPDF()"
            class="w-full px-4 py-3 bg-[#d92d20] hover:bg-[#b02419] text-white font-medium rounded-lg transition shadow-md flex items-center justify-center gap-2 text-sm"
          >
            Descargar PDF
          </button>
        </div>
      </div>
    </div>

    <div class="flex-1 flex flex-col items-center">
      <div
        *ngIf="!mostrarDocumento"
        class="w-full max-w-[850px] h-[800px] bg-white border-2 border-dashed border-gray-300 rounded-2xl flex flex-col items-center justify-center text-gray-400"
      >
        <p class="text-lg font-medium">Complete la configuración para previsualizar</p>
      </div>

      <div *ngIf="mostrarDocumento" class="w-full flex flex-col items-center">
        <div #documentoRender class="flex flex-col gap-8 pb-20 antialiased-document">
          <div class="page-a4">
            <img src="/fondo-carta-entendimiento.png" class="bg-img-documento" />

            <div class="content-wrapper-documento">
              <div *ngFor="let bloque of data.bloques.slice(0, 11); let first = first">
                <ng-container
                  *ngTemplateOutlet="renderBloque; context: { $implicit: bloque, isFirst: first }"
                ></ng-container>
              </div>
            </div>
          </div>

          <div class="page-a4">
            <img src="/fondo-carta-entendimiento.png" class="bg-img-documento" />

            <div class="content-wrapper-documento">
              <div *ngFor="let bloque of data.bloques.slice(11); let first = first">
                <ng-container
                  *ngTemplateOutlet="renderBloque; context: { $implicit: bloque, isFirst: first }"
                ></ng-container>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<ng-template #renderBloque let-bloque let-isFirst="isFirst">
  <h2
    *ngIf="bloque.tipo === 'titulo'"
    [ngClass]="{ 'mt-0': isFirst }"
    class="text-[18px] font-bold text-center uppercase mb-1 leading-tight"
  >
    {{ bloque.texto }}
  </h2>

  <h2
    *ngIf="bloque.tipo === 'subtitulo'"
    class="text-[16px] font-bold text-center uppercase mb-6 leading-tight"
  >
    {{ bloque.texto }}
  </h2>

  <p *ngIf="bloque.tipo === 'parrafo'" class="text-justify text-[14px] mb-3 custom-leading-pdf">
    <ng-container *ngFor="let parte of bloque.partes">
      <span [class.font-bold]="parte.tipo === 'campo'">{{ parte.valor }}</span>
    </ng-container>
  </p>

  <div *ngIf="bloque.tipo === 'lista'" class="mb-4">
    <ul
      [ngClass]="{
        'list-decimal': bloque.estilo === 'numeros',
        'list-disc': bloque.estilo === 'vinetas',
      }"
      class="custom-list-style text-[14px] custom-leading-pdf"
    >
      <li *ngFor="let item of bloque.items" class="text-justify">
        {{ item }}
      </li>
    </ul>
  </div>
</ng-template>
