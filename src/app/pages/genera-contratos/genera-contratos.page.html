<div class="h-screen w-screen bg-slate-200 p-4 md:p-8 font-sans flex flex-col overflow-hidden">
  <div
    class="max-w-7xl mx-auto grid grid-cols-1 md:grid-cols-12 gap-8 w-full h-full overflow-hidden"
  >
    <div class="md:col-span-4 flex flex-col gap-6 h-full overflow-hidden relative">
      <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200 shrink-0">
        <h2 class="text-2xl font-extrabold text-slate-800 mb-6 flex items-center">
          <span class="bg-blue-600 text-white p-2 rounded-xl mr-3 shadow-lg">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="h-6 w-6"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"
              />
            </svg>
          </span>
          Documentos
        </h2>
        <div class="space-y-4">
          <div>
            <label
              class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1 ml-1"
              >Tipo Afiliación</label
            >
            <input
              type="text"
              [value]="tipoAfiliacion"
              readonly
              class="w-full px-4 py-2 bg-slate-50 border border-slate-200 rounded-xl text-slate-500 font-medium outline-none"
            />
          </div>
          <div>
            <label
              class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1 ml-1"
              >Tipo Solicitud</label
            >
            <select
              (change)="onSolicitudManual($event)"
              class="w-full px-4 py-2 bg-white border-2 border-slate-100 rounded-xl text-slate-700 font-bold focus:border-blue-500 outline-none transition-all cursor-pointer shadow-sm"
            >
              <option value="" disabled selected>Seleccione una plantilla...</option>
              <option value="registro">Registro de Afiliación</option>
              <option value="cambio">Solicitud Cambio de cuenta bancaria</option>
            </select>
          </div>

          <button
            (click)="exportarPDF()"
            [disabled]="cargando || !tipoSolicitud"
            class="w-full bg-slate-900 text-white font-bold py-4 rounded-2xl hover:bg-slate-800 transition-all active:scale-[0.98] flex justify-center items-center shadow-lg disabled:opacity-50 disabled:cursor-not-allowed"
          >
            <span *ngIf="!cargando">Descargar PDF</span>

            <span *ngIf="cargando" class="flex items-center">
              <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" ...>...</svg>
              Generando archivo...
            </span>
          </button>
        </div>
      </div>

      <div
        *ngIf="camposDetectados.length > 0"
        class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200 flex flex-col flex-grow overflow-hidden relative"
      >
        <h3 class="text-lg font-bold text-slate-700 mb-4 shrink-0 px-1">Variables Detectadas</h3>

        <div class="flex-grow overflow-y-auto pr-2 custom-scrollbar space-y-4 pb-24">
          <div *ngFor="let campo of camposDetectados" class="px-1">
            <label
              class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1 ml-1"
              >{{ formatLabel(campo) }}</label
            >
            <input
              type="text"
              [(ngModel)]="valores[campo]"
              class="w-full px-4 py-2 bg-slate-50 border-2 border-slate-100 rounded-xl text-slate-700 focus:bg-white focus:border-blue-500 outline-none transition-all"
            />
          </div>
        </div>

        <div
          class="absolute bottom-0 left-0 w-full p-6 bg-gradient-to-t from-white via-white to-transparent shrink-0 rounded-b-3xl"
        >
          <button
            (click)="procesarYRenderizar()"
            class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-xl shadow-lg transition-all active:scale-95 uppercase text-xs tracking-widest"
          >
            Actualizar Vista
          </button>
        </div>
      </div>
    </div>

    <div class="md:col-span-8 flex flex-col h-full overflow-hidden">
      <div
        class="w-full h-full bg-slate-400 rounded-[2.5rem] shadow-inner border border-slate-300 overflow-x-auto overflow-y-auto custom-scrollbar relative"
      >
        <div #renderContainer class="pagedjs-container"></div>

        <div
          *ngIf="cargando"
          class="absolute inset-0 flex flex-col items-center justify-center bg-slate-400/80 backdrop-blur-sm z-50 rounded-[2.5rem]"
        >
          <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-white mb-4"></div>
          <p class="text-white font-bold tracking-widest uppercase">Procesando documento...</p>
        </div>
      </div>
    </div>
  </div>

  <div
    *ngIf="showToast"
    class="fixed top-5 right-5 z-[100] flex items-center gap-3 px-4 py-3 rounded shadow-lg text-white transition-all duration-500"
    [ngClass]="{
      'animate-fade-in': !isClosingToast,
      'animate-fade-out': isClosingToast,
      'bg-green-600': toastType === 'success',
      'bg-red-600': toastType === 'error',
    }"
  >
    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
      <path
        fill-rule="evenodd"
        d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z"
        clip-rule="evenodd"
      />
    </svg>
    <span class="font-bold text-sm text-white">Documento generado exitosamente</span>
  </div>
</div>
