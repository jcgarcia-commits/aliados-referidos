<div class="h-screen w-screen bg-slate-200 p-4 md:p-8 font-sans flex flex-col overflow-hidden">
  <div
    *ngIf="showToast"
    class="fixed top-5 right-5 z-[100] flex items-center gap-3 px-4 py-3 rounded shadow-lg text-white"
    [ngClass]="{
      'animate-slide-in': !isClosingToast,
      'animate-fade-out': isClosingToast,
      'bg-green-600': toastType === 'info' || toastType === 'success',
      'bg-red-600': toastType === 'error'
    }"
  >
    <span class="font-medium text-white text-sm">{{ toastMessage }}</span>
  </div>

  <div class="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-8 w-full h-full overflow-hidden">
    <div class="lg:col-span-4 flex flex-col gap-6 h-full overflow-hidden">
      <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 shrink-0">
        <h2 class="text-xl font-bold text-slate-800 mb-4 flex items-center">
          <span class="bg-blue-600 text-white p-1.5 rounded-lg mr-2">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
            </svg>
          </span>
          Cargar Plantilla
        </h2>
        <input #fileInput type="file" (change)="onFileSelected($event)" accept=".docx" class="block w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 transition-all cursor-pointer" />
      </div>

      <div *ngIf="variables.length > 0" class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex flex-col flex-grow overflow-hidden">
        <h3 class="text-sm font-bold text-slate-500 uppercase tracking-wider mb-4">Campos Detectados</h3>
        <div class="flex-grow overflow-y-auto pr-2 custom-scrollbar">
          <div class="space-y-2">
            <div *ngFor="let varName of variables" class="input-wrapper">
              <label class="block text-sm font-semibold text-slate-700 mb-1 capitalize">
                {{ formatLabel(varName) }} <span class="text-red-500">*</span>
              </label>
              <input 
                [(ngModel)]="formValues[varName]" 
                (input)="formErrors[varName] = false" 
                type="text" 
                class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition-all text-sm" 
                [ngClass]="{
                  'bg-slate-50 border-slate-300': !formErrors[varName],
                  'bg-red-50 border-red-500 animate-shake': formErrors[varName]
                }" 
                placeholder="Ingrese descripción de la variable" 
              />
            </div>
          </div>
        </div>
        <div class="space-y-3 mt-4 shrink-0">
          <button (click)="guardarPlantilla()" [disabled]="isLoading" class="w-full bg-slate-900 text-white font-bold py-4 rounded-xl hover:bg-slate-800 transition-all active:scale-[0.98] flex justify-center items-center shadow-lg">
            <ng-container *ngIf="!isLoading"> Guardar Plantilla </ng-container>
            <ng-container *ngIf="isLoading">Procesando...</ng-container>
          </button>
          <button (click)="exportarHTML()" [disabled]="isLoading" class="w-full bg-white text-slate-900 border-2 border-slate-900 font-bold py-3 rounded-xl hover:bg-slate-50 transition-all flex justify-center items-center">Exportar HTML</button>
        </div>
      </div>
    </div>

    <div class="lg:col-span-8 flex flex-col h-full overflow-hidden">
      <div [hidden]="!archivoOriginal" class="preview-window-container custom-scrollbar shadow-inner border border-slate-300">
        <div #previewContainer id="preview-container"></div>
      </div>
      <div *ngIf="!archivoOriginal" class="flex flex-col items-center justify-center w-full h-full border-4 border-dashed border-slate-300 rounded-3xl text-slate-400 bg-white/50">
        <p class="text-lg font-medium">Sube un archivo para previsualizar</p>
      </div>
    </div>
  </div>
</div>
