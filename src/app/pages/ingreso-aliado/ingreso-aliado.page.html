<nav class="my-2" aria-label="breadcrumb">
  <ol class="flex items-center space-x-2 text-sm">
    <li><a routerLink="/" class="text-blue-600 hover:text-blue-800">Inicio</a></li>
    <li class="flex items-center">
      <span class="mx-2 text-gray-400">&gt;</span>
      <span class="text-gray-600">Aliado</span>
    </li>
  </ol>
</nav>

<!-- Contenedor en una sola fila -->
<div class="bg-white">
  <div class="flex items-center justify-between w-full px-2 py-2">
    <!-- Radios alineados horizontalmente -->
    <div class="flex items-center gap-6">
      <!-- Buscar por nombre -->
      <label class="flex items-center gap-2 bg-neutral-primary-soft px-2 py-1 rounded">
        <input
          type="radio"
          name="searchMode"
          value="nombre"
          [(ngModel)]="searchMode"
          class="w-4 h-4"
        />
        <span class="select-none text-sm font-medium text-heading">Buscar por nombre</span>
      </label>

      <!-- Buscar por documento -->
      <label class="flex items-center gap-2 bg-neutral-primary-soft px-2 py-1 rounded">
        <input
          type="radio"
          name="searchMode"
          value="documento"
          [(ngModel)]="searchMode"
          class="w-4 h-4"
        />
        <span class="select-none text-sm font-medium text-heading"
          >Buscar por número de documento</span
        >
      </label>
    </div>

    <!-- Botón alineado a la derecha -->
    <button
      class="bg-blue-600 hover:bg-blue-700 text-white text-sm px-4 py-2 rounded transition-colors"
      (click)="openModal()"
    >
      Crear Representante
    </button>
  </div>

  <div class="p-6">
    <!-- Contenedor flexible que mantiene alineado todo -->
    <form class="flex flex-wrap items-end gap-4">
      <!-- INPUT NOMBRE -->
      <div *ngIf="searchMode === 'nombre'" class="flex-1 min-w-[200px]">
        <label class="block mb-2 text-sm font-medium text-gray-900">Nombres y Apellidos</label>
        <input
          type="text"
          id="txtBuscar"
          class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
          placeholder="Nombre y Apellidos"
          #txtBuscar
          (input)="buscador.set(txtBuscar.value)"
          (keyup.enter)="fetchData()"
        />
      </div>

      <!-- CAMPOS DOCUMENTO -->
      <div *ngIf="searchMode === 'documento'" class="flex flex-wrap gap-4 flex-1">
        <!-- Tipo Documento -->
        <div class="min-w-[200px] flex-1">
          <label class="block mb-2 text-sm font-medium text-gray-900">Tipo Documento</label>
          <select
            id="tipo"
            name="tipo"
            class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-600 focus:border-blue-600 w-full p-2.5"
          >
            <option value="">Seleccione un tipo</option>
            <option value="dpi">DPI</option>
            <option value="nit">NIT</option>
          </select>
        </div>

        <!-- Número de Documento -->
        <div class="min-w-[200px] flex-1">
          <label class="block mb-2 text-sm font-medium text-gray-900">Documento</label>
          <input
            type="number"
            id="documento"
            class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-600 focus:border-blue-600 w-full p-2.5"
          />
        </div>
      </div>

      <!-- Botón Buscar SIEMPRE alineado -->
      <div class="flex items-end">
        <button
          type="button"
          (click)="fetchData()"
          class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded transition-colors"
        >
          Buscar
        </button>
      </div>
    </form>
  </div>
</div>
<div class="overflow-x-auto mt-4">
  <!-- Tabla -->
  <table class="min-w-full border border-gray-300">
    <thead class="bg-gray-50">
      <tr>
        <th
          class="text-center px-4 py-2 border-b border-gray-300 text-sm font-semibold text-gray-700"
        >
          #
        </th>
        <th
          class="text-left px-4 py-2 border-b border-gray-300 text-sm font-semibold text-gray-700"
        >
          Nombre
        </th>
        <th
          class="text-left px-4 py-2 border-b border-gray-300 text-sm font-semibold text-gray-700"
        >
          Documento
        </th>
        <th
          class="text-left px-4 py-2 border-b border-gray-300 text-sm font-semibold text-gray-700"
        >
          Tipo
        </th>
        <th
          class="text-center px-4 py-2 border-b border-gray-300 text-sm font-semibold text-gray-700"
        >
          Acciones
        </th>
      </tr>
    </thead>
    <tbody class="text-[0.85em]">
      @for (item of empresasList(); track item.empresaId; let i = $index) {
      <tr class="hover:bg-gray-50 border-b border-gray-200">
        <td class="px-4 py-2 text-center">{{ i + 1 }}</td>
        <td class="px-4 py-2">{{ item.nombre }}</td>
        <td class="px-4 py-2">{{ item.direccion }}</td>
        <td class="px-4 py-2">{{ item.nit }}</td>
        <td class="px-4 py-2 text-center flex justify-center gap-2">
          <!-- Edit button -->
          <button
            class="w-8 h-8 bg-green-600 hover:bg-green-800 text-white rounded transition-colors flex items-center justify-center"
            (click)="openModal()"
          >
            <lucide-icon [img]="SquarePen" [size]="16" [strokeWidth]="1"></lucide-icon>
          </button>
        </td>
      </tr>
      }
    </tbody>
  </table>
</div>

<!-- aliados.component.html -->

<!-- Modal -->
<div
  *ngIf="showModal()"
  class="fixed inset-0 bg-black bg-opacity-40 flex items-center justify-center z-50"
>
  <div class="bg-white rounded-xl shadow-xl w-[600px] p-6 relative">
    <!-- Botón cerrar -->
    <button class="absolute top-3 right-3 text-gray-600 hover:text-black" (click)="closeModal()">
      ✕
    </button>

    <!-- AQUÍ SE INSERTA TU COMPONENTE -->
    <app-gestion-representante-accordion></app-gestion-representante-accordion>
  </div>
</div>
