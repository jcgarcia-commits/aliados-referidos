<form action="#">
  <div class="fixed top-4 right-4 space-y-2 z-50" id="toast-container"></div>

  <div class="grid gap-4 mb-4 sm:grid-cols-2">
    <div>
      <h2 class="text-lg font-bold text-gray-800 text-center mb-4 leading-snug">Paola Citán</h2>
    </div>

    <div>
      <h2 class="text-lg font-bold text-gray-800 text-center mb-4 leading-snug">
        Librería Milenium
      </h2>
    </div>
  </div>

  <div class="mt-2 grid gap-4 mb-4 sm:grid-cols-2">
    <div>
      <label for="username" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white"
        >Fecha solicitud
      </label>
      <div class="relative max-w-sm">
        <div class="absolute inset-y-0 start-0 flex items-center ps-3 pointer-events-none">
          <svg
            class="w-4 h-4 text-body"
            aria-hidden="true"
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            fill="none"
            viewBox="0 0 24 24"
          >
            <path
              stroke="currentColor"
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M4 10h16m-8-3V4M7 7V4m10 3V4M5 20h14a1 1 0 0 0 1-1V7a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1Zm3-7h.01v.01H8V13Zm4 0h.01v.01H12V13Zm4 0h.01v.01H16V13Zm-8 4h.01v.01H8V17Zm4 0h.01v.01H12V17Zm4 0h.01v.01H16V17Z"
            />
          </svg>
        </div>
        <input
          id="datepicker-autohide-109"
          datepicker
          datepicker-autohide
          type="text"
          class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full ps-10 p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
          placeholder="Select date"
        />
      </div>
    </div>
  </div>

  <div class="grid gap-4 mb-4 sm:grid-cols-2">
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1" for="tipo"
        >Tipo de Afiliación</label
      >
      <select
        id="tipo"
        name="tipo"
        class="w-full px-3 py-2 text-sm border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
      >
        <option value="">Seleccione tipo afiliación</option>
        <option value="publica">Red de referidos</option>
      </select>
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1" for="tipo">Tipo solicitud</label>
      <select
        id="tipo"
        name="tipo"
        class="w-full px-3 py-2 text-sm border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
      >
        <option value="">Seleccione tipo solicitud</option>
        <option value="publica">Afiliación</option>
        <option value="privada">Actualización de cuenta bancaria</option>
      </select>
    </div>
  </div>

  <div class="mt-2 grid gap-4 mb-4 sm:grid-cols-2">
    <div>
      <label for="username" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white"
        >Observaciones</label
      >
      <input
        type="text"
        name="username"
        id="username"
        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-600 focus:border-blue-600 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
        placeholder="Observaciones"
        required=""
      />
    </div>
    <div>
      <label for="email" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white"
        >Estado de la solicitud</label
      >
      <h1 style="color: red">Pendiente de aprobación</h1>
    </div>
  </div>

  <div class="mt-2 grid gap-4 mb-4 sm:grid-cols-1">
    <div class="flex flex-col items-end">
      <button
        type="button"
        (click)="verDocumento()"
        class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded transition-colors"
      >
        Ver Documento
      </button>
    </div>
  </div>
</form>
