<form id="empresaForm" class="max-w-xl mx-auto p-4 bg-white rounded-md shadow-md space-y-4">
  <div class="fixed top-4 right-4 space-y-2 z-50" id="toast-container"></div>
  <div class="mt-2 grid gap-4 mb-4 sm:grid-cols-2">
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1" for="tipo"
        >Aprobación de la solicitud</label
      >
      <select
        id="tipo"
        name="tipo"
        class="w-full px-3 py-2 text-sm border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
        [(ngModel)]="accion"
        (change)="actualizarBoton()"
      >
        <option value="">Seleccione</option>
        <option value="validar">APROBAR REGISTRO AFILIADO</option>
        <option value="correccion">COMPLETAR EXPEDIENTE</option>
        <option value="rechazar">RECHAZAR REGISTRO AFILIADO</option>
        <option value="aprobar">APROBAR CAMBIO DE CUENTA BANCARIA</option>
      </select>
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1" for="nombre"
        >Opción seleccionada</label
      >
      <button
        (click)="onClickBoton()"
        [ngClass]="{
          'bg-green-600': accion === 'validar',
          'bg-yellow-500': accion === 'correccion',
          'bg-red-600': accion === 'rechazar',
          'bg-blue-600': accion === 'aprobar'
        }"
        class="text-white px-4 py-2 rounded w-full transition transform duration-150 hover:brightness-110 active:scale-95 active:brightness-75"
        type="submit"
      >
        {{ accion | uppercase }}
      </button>
    </div>
  </div>

  <div>
    <label class="block text-sm font-medium text-gray-700 mb-1" for="nombre">Observaciones</label>
    <input
      id="nombre"
      name="nombre"
      type="text"
      [(ngModel)]="observacionTexto"
      [required]="observacionObligatoria"
      class="w-full px-3 py-2 text-sm border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent border-gray-300"
      placeholder="Comentarios/Observaciones"
      [ngClass]="{
        'border-red-500 ring-1 ring-red-500': observacionObligatoria && !observacionTexto
      }"
      [required]="observacionObligatoria"
    />
  </div>
</form>
