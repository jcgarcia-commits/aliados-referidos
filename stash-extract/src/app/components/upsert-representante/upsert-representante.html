<form action="#">
  <div class="mt-2 grid gap-4 mb-4 sm:grid-cols-1">
    <div>
      <button
        type="button"
        class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded transition-colors"
        (click)="abrirModal()"
      >
        Asignar Representante
      </button>
    </div>
  </div>
  <div class="mt-2 grid gap-4 mb-4 sm:grid-cols-2">
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1" for="nombre"
        >Código Representante</label
      >
      <input
        id="nombre"
        name="nombre"
        type="number"
        class="w-full px-3 py-2 text-sm border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
        placeholder="Código Representante"
        required
        minlength="3"
      />
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1" for="nombre"
        >Nombre Representante</label
      >
      <input
        id="nombre"
        name="nombre"
        type="text"
        class="w-full px-3 py-2 text-sm border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
        placeholder="Nombre Representante"
        required
        minlength="3"
      />
    </div>
  </div>

  <div class="mt-2 grid gap-4 mb-4 sm:grid-cols-2">
    <div></div>

    <div>
      <label for="email" class="ml-auto block text-sm font-medium text-gray-900 dark:text-white"
        >Relación Representante<span class="text-red-600">*</span></label
      >

      <select
        id="tipo"
        name="tipo"
        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-600 focus:border-blue-600 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
      >
        <option value="">Seleccione Relación</option>
        <option value="publica">Propietario</option>
        <option value="privada">Rep. Legal</option>
      </select>
    </div>
  </div>

  <div class="flex justify-between gap-2">
    <button
      type="button"
      class="bg-gray-600 hover:bg-gray-700 text-white px-4 py-2 rounded transition-colors"
      onclick="document.getElementById('empresaForm').reset();"
    >
      Cancelar
    </button>
    <button
      type="submit"
      class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded transition-colors"
    >
      Guardar
    </button>
  </div>
</form>

<!-- Modal -->
<div
  *ngIf="modalAbierto"
  class="fixed inset-0 flex items-center justify-center bg-black bg-opacity-50 z-50"
>
  <div
    class="bg-white rounded-lg shadow-lg w-full max-w-3xl p-6 relative max-h-[90vh] overflow-auto"
  >
    <!-- Botón cerrar -->
    <button
      class="absolute top-3 right-3 text-gray-500 hover:text-gray-700"
      (click)="cerrarModal()"
    >
      ✕
    </button>

    <!-- Contenido del modal -->
    <h2 class="text-lg font-semibold mb-4">Asignar Representante</h2>

    <div class="mb-6 text-gray-600">
      <app-lista-representantes (cerrar)="cerrarModal()"></app-lista-representantes>
    </div>
  </div>
</div>
