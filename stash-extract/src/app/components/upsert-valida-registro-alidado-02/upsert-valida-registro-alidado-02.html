<form id="empresaForm" class="max-w-xl mx-auto p-4 bg-white rounded-md shadow-md space-y-4">
  <div class="grid gap-4 mb-4 sm:grid-cols-2">
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1" for="tipo"
        >Revisión del formulario completo?</label
      >
    </div>

    <div>
      <select
        id="tipo"
        name="tipo"
        class="w-full px-3 py-2 text-sm border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
      >
        <option value="publica">Sí</option>
        <option value="privada">No</option>
      </select>
    </div>
  </div>

  <div class="grid gap-4 mb-4 sm:grid-cols-2">
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1" for="tipo"
        >El nombre del afiliado es correcto?</label
      >
    </div>

    <div>
      <select
        id="tipo"
        name="tipo"
        class="w-full px-3 py-2 text-sm border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
      >
        <option value="publica">Sí</option>
        <option value="privada">No</option>
      </select>
    </div>
  </div>

  <div class="grid gap-4 mb-4 sm:grid-cols-2">
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1" for="tipo"
        >El número de DPI del afiliado es correcto? (validar contra imagen de DPI)</label
      >
    </div>

    <div>
      <select
        id="tipo"
        name="tipo"
        class="w-full px-3 py-2 text-sm border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
      >
        <option value="publica">Sí</option>
        <option value="privada">No</option>
      </select>
    </div>
  </div>
  <div class="grid gap-4 mb-4 sm:grid-cols-2">
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1" for="tipo"
        >La cuenta bancaria del afiliado es correcta? (validar con formulario firmado)</label
      >
    </div>

    <div>
      <select
        id="tipo"
        name="tipo"
        class="w-full px-3 py-2 text-sm border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
      >
        <option value="publica">Sí</option>
        <option value="privada">No</option>
      </select>
    </div>
  </div>
  <div class="grid gap-4 mb-4 sm:grid-cols-2">
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1" for="tipo"
        >La firma del afiliado corresponde a la firma del DPI? (validar con la imagen del
        DPI)</label
      >
    </div>

    <div>
      <select
        id="tipo"
        name="tipo"
        class="w-full px-3 py-2 text-sm border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
      >
        <option value="publica">Sí</option>
        <option value="privada">No</option>
      </select>
    </div>
  </div>

  <div class="grid gap-4 mb-4 sm:grid-cols-2">
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1" for="tipo"
        >El afiliado es empleado de FUNDEA?</label
      >
    </div>

    <div>
      <select
        id="tipo"
        name="tipo"
        class="w-full px-3 py-2 text-sm border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
      >
        <option value="publica">Sí</option>
        <option value="privada" selected>No</option>
      </select>
    </div>
  </div>

  <div class="grid gap-4 mb-4 sm:grid-cols-2">
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1" for="tipo">
        El afiliado es proveedor de FUNDEA?</label
      >
    </div>

    <div>
      <select
        id="tipo"
        name="tipo"
        class="w-full px-3 py-2 text-sm border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
      >
        <option value="publica">Sí</option>
        <option value="privada" selected>No</option>
      </select>
    </div>
  </div>

  <div class="grid gap-4 mb-4 sm:grid-cols-2">
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1" for="tipo">
        Verificó que el afiliado cuente con buena reputación dentro de la comunidad?</label
      >
    </div>

    <div>
      <select
        id="tipo"
        name="tipo"
        class="w-full px-3 py-2 text-sm border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
      >
        <option value="publica">Sí</option>
        <option value="privada">No</option>
      </select>
    </div>
  </div>
</form>
