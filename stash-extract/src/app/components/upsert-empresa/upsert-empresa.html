<form action="#">
  <div class="mt-2 grid gap-4 mb-4 sm:grid-cols-3">

      <label class="block text-sm font-medium text-gray-700 mb-1" for="nombre"
        >Nombre de la Empresa<span class="text-red-600">*</span></label
      >
      <input
        id="nombre"
        name="nombre"
        type="text"
        class="w-full px-3 py-2 text-sm border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
        placeholder="Nombre Empresa"
        required
        minlength="3"
      />
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1" for="nombre"
        >NIT<span class="text-red-600">*</span></label
      >
      <input
        id="nombre"
        name="nombre"
        type="number"
        class="w-full px-3 py-2 text-sm border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
        placeholder="Número de NIT"
        required
        minlength="3"
      />
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1" for="nombre"
        >Teléfono<span class="text-red-600">*</span></label
      >
      <input
        id="nombre"
        name="nombre"
        type="number"
        class="w-full px-3 py-2 text-sm border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"

        required

      />

  <div class="mt-1 grid gap-4 mb-4 sm:grid-cols-2">
    <div>
      <label for="email" class="ml-auto block text-sm font-medium text-gray-900 dark:text-white"
        >Departamento<span class="text-red-600">*</span></label
      >

      <select
        id="tipo"
        name="tipo"
        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-600 focus:border-blue-600 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
      >
        <option value="">Departamento</option>
        <option value="publica">Chimaltenango</option>
        <option value="publica">Sacatepéquez</option>
        <option value="publica">Escuintla</option>
        <option value="publica">Cobán</option>
      </select>

    <div>
      <label for="email" class="ml-auto block text-sm font-medium text-gray-900 dark:text-white"
        >Municipio<span class="text-red-600">*</span></label
      >

      <select
        id="tipo"
        name="tipo"
        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-600 focus:border-blue-600 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
      >
        <option value="">Municipio</option>
        <option value="publica">Chimaltenango</option>
        <option value="publica">Tecpán</option>
        <option value="publica">Parramos</option>
        <option value="publica">Acatenango</option>

  <div class="mt-2 grid gap-4 mb-4 sm:grid-cols-1">
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1" for="nombre"
        >Dirección<span class="text-red-600">*</span></label
      >
      <input
        id="nombre"
        name="nombre"
        type="text"
        class="w-full px-3 py-2 text-sm border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
        placeholder="Dirección completa"
        required
        minlength="3"
