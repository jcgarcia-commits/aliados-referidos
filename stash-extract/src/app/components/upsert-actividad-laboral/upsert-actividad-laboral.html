<form action="#">
  <div class="mt-2 grid gap-4 mb-4 sm:grid-cols-2">
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1" for="tipo"
        >Tipo Actividad (*)</label
      >
      <select
        id="tipo"
        name="tipo"
        class="w-full px-3 py-2 text-sm border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
      >
        <option value="">Seleccione Tipo Actividad</option>
        <option value="publica">CONSTRUCCIÓN</option>
        <option value="privada">COMERCIO</option>
        <option value="publica">ACTIVIDADES INMOBILIARIAS</option>
        <option value="publica">HOTELES Y RESTAURANTES</option>
        <option value="privada">ESTABLECIMIENTOS FINANCIEROS</option>
        <option value="publica">OTRAS ACTIVIDADES</option>
      </select>
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1" for="tipo">Actividad (*)</label>
      <select
        id="tipo"
        name="tipo"
        class="w-full px-3 py-2 text-sm border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
      >
        <option value="">Seleccione Actividad</option>
        <option value="publica">PRESTACIÓN DE SERVICIOS ARTESANALES</option>
        <option value="privada">PRESTACIÓN DE SERVICIOS PROFESIONALES</option>
        <option value="publica">PRESTACIÓN DE SERVICIS TÉCNICOS</option>
      </select>
    </div>
  </div>
  <div>
    <label for="username" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white"
      >Inicio (*)
    </label>
    <div class="relative max-w-sm">
      <div class="absolute inset-y-0 start-0 flex items-center ps-3 pointer-events-none">
        <svg
          class="w-4 h-4 text-body"
          aria-hidden="true"
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          fill="none"
          viewBox="0 0 24 24"
        >
          <path
            stroke="currentColor"
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"

          />

      <input

        datepicker-autohide

        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full ps-10 p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
